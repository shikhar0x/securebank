<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div id="sidebar-wrapper" class="d-none">
        <div class="sidebar-heading d-flex align-items-center gap-2">
            <i class="fa-solid fa-vault text-primary fs-4"></i>
            <span>SecureBank</span>
        </div>
        <div class="list-group list-group-flush mt-2" id="sidebar-menu-list">
            <!-- Dynamic Role Menu Items -->
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" style="margin-left: 0; width: 100%;">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-top d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <span class="fw-bold fs-5 text-dark"><i class="fa-solid fa-shield-halved text-primary me-2"></i>SecureBank</span>
            </div>

            <!-- Navbar User Section -->
            <div id="navbar-user-section" class="d-none d-flex align-items-center gap-3">
                <!-- Persona Switcher Dropdown -->
                <div class="dropdown">
                    <button class="persona-btn dropdown-toggle" type="button" id="personaDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-users-gear text-primary me-1"></i> Persona Switcher
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" id="persona-dropdown-menu" aria-labelledby="personaDropdown" style="min-width: 260px;">
                        <!-- Personas populated dynamically -->
                    </ul>
                </div>

                <div class="vr mx-1 text-muted"></div>

                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-circle-user text-secondary fs-4"></i>
                    <div>
                        <div class="fw-bold text-dark small" id="nav-user-name">User</div>
                        <span id="nav-user-role" class="role-badge">ROLE</span>
                    </div>
                </div>

                <button class="btn btn-outline-danger btn-sm ms-2" onclick="handleLogout()" title="Log Out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Navbar Guest Section -->
            <div id="navbar-auth-section" class="d-flex align-items-center gap-2">
                <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2">SecureBank Portal</span>
            </div>
        </nav>

        <!-- Main Content View Container -->
        <div class="container-fluid p-4" id="main-view-container">
            <!-- Dynamically Rendered Views -->
        </div>
    </div>
</div>

<!-- Toast Notifications Container -->
<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

<!-- Transfer Funds Modal -->
<div class="modal fade" id="transferModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-paper-plane text-primary me-2"></i>Atomic Fund Transfer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form onsubmit="event.preventDefault(); submitTransfer();">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Source Account ID</label>
                        <input type="number" id="transfer-from-id" class="form-control" placeholder="Source Account ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Destination Account ID</label>
                        <input type="number" id="transfer-to-id" class="form-control" placeholder="Target Account ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Transfer Amount (₹)</label>
                        <input type="number" step="0.01" id="transfer-amount" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Description</label>
                        <input type="text" id="transfer-desc" class="form-control" value="Account Transfer">
                    </div>
                    <div class="alert alert-info small py-2">
                        <i class="fa-solid fa-circle-info me-1"></i> Transfers are atomic. In case of error, changes roll back immediately.
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Execute Transfer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Application Scripts -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
